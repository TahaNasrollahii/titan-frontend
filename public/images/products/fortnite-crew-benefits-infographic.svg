<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="50%" stop-color="#11192c" />
      <stop offset="100%" stop-color="#0d121f" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e2453f" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182238" />
      <stop offset="100%" stop-color="#101726" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a52" />
      <stop offset="100%" stop-color="#e2453f" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="1196" height="556" rx="26" fill="none" stroke="#00d4ff" stroke-opacity="0.28" stroke-width="2" />

  <!-- Decorative Glow -->
  <circle cx="1050" cy="90" r="220" fill="url(#cyanGlow)" />
  <circle cx="150" cy="470" r="220" fill="url(#cyanGlow)" />

  <!-- Header Pill (Pure Persian to prevent SVG bidi reordering) -->
  <rect x="350" y="26" width="500" height="38" rx="19" fill="#00d4ff" fill-opacity="0.12" stroke="#00d4ff" stroke-opacity="0.4" />
  <text x="600" y="51" text-anchor="middle" direction="rtl" fill="#00d4ff" font-family="Tahoma, Vazirmatn, sans-serif" font-size="15" font-weight="bold">
    مزایای دائمی اشتراک ماهانه کروپک فورتنایت در فروشگاه تایتان
  </text>

  <text x="600" y="102" text-anchor="middle" direction="rtl" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif" font-size="26" font-weight="bold">
    با یک بار خرید کروپک در هر ماه چه چیزهایی دریافت می‌کنید؟
  </text>
  <text x="600" y="134" text-anchor="middle" direction="rtl" fill="#94a3b8" font-family="Tahoma, Vazirmatn, sans-serif" font-size="15">
    بروزرسانی خودکار اسکین در اول هر ماه میلادی • حفظ دائمی آیتم‌ها در لاکر • فعال‌سازی روی تمام پلتفرم‌ها
  </text>

  <!-- Card 1 (Rightmost): 1,000 V-Bucks -->
  <g transform="translate(905, 165)">
    <rect width="255" height="345" rx="20" fill="url(#cardGrad)" stroke="#00d4ff" stroke-opacity="0.38" stroke-width="1.5" />
    <circle cx="127.5" cy="58" r="32" fill="url(#accentCyan)" fill-opacity="0.2" stroke="#00d4ff" stroke-width="2" />
    <text x="127.5" y="66" text-anchor="middle" fill="#00d4ff" font-family="Tahoma, sans-serif" font-size="22" font-weight="bold">1000</text>
    <text x="127.5" y="114" text-anchor="middle" fill="#38bdf8" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1">
      1,000 V-BUCKS
    </text>
    <text x="127.5" y="144" text-anchor="middle" direction="rtl" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif" font-size="20" font-weight="bold">
      هزار وی‌باکس ماهانه
    </text>
    <text x="127.5" y="180" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      شارژ مستقیم هزار عدد وی‌باکس
    </text>
    <text x="127.5" y="206" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      برای خرید اسکین، دنس و باندل
    </text>
    <text x="127.5" y="232" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      از آیتم‌شاپ روزانه فورتنایت
    </text>
    <rect x="28" y="276" width="199" height="40" rx="12" fill="#00d4ff" fill-opacity="0.14" />
    <text x="127.5" y="301" text-anchor="middle" direction="rtl" fill="#38bdf8" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13" font-weight="bold">
      ماندگاری دائمی در اکانت شما
    </text>
  </g>

  <!-- Card 2: All 4 Fortnite Passes -->
  <g transform="translate(617, 165)">
    <rect width="255" height="345" rx="20" fill="url(#cardGrad)" stroke="#fbbf24" stroke-opacity="0.38" stroke-width="1.5" />
    <circle cx="127.5" cy="58" r="32" fill="url(#accentGold)" fill-opacity="0.2" stroke="#fbbf24" stroke-width="2" />
    <text x="127.5" y="66" text-anchor="middle" fill="#fbbf24" font-family="Tahoma, sans-serif" font-size="21" font-weight="bold">4X</text>
    <text x="127.5" y="114" text-anchor="middle" fill="#fbbf24" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1">
      ALL 4 FORTNITE PASSES
    </text>
    <text x="127.5" y="144" text-anchor="middle" direction="rtl" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif" font-size="20" font-weight="bold">
      هر چهار پس فعال بازی
    </text>
    <text x="127.5" y="180" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      بتل‌پس اصلی فصل جاری فورتنایت
    </text>
    <text x="127.5" y="206" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      پس کلاسیک فورتنایت او‌جی
    </text>
    <text x="127.5" y="232" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      لگو پس و موزیک پس فستیوال
    </text>
    <rect x="28" y="276" width="199" height="40" rx="12" fill="#fbbf24" fill-opacity="0.14" />
    <text x="127.5" y="301" text-anchor="middle" direction="rtl" fill="#fbbf24" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13" font-weight="bold">
      دسترسی هم‌زمان با یک اشتراک
    </text>
  </g>

  <!-- Card 3: Exclusive Monthly Skin Bundle -->
  <g transform="translate(329, 165)">
    <rect width="255" height="345" rx="20" fill="url(#cardGrad)" stroke="#e2453f" stroke-opacity="0.42" stroke-width="1.5" />
    <circle cx="127.5" cy="58" r="32" fill="url(#accentRed)" fill-opacity="0.2" stroke="#e2453f" stroke-width="2" />
    <text x="127.5" y="66" text-anchor="middle" fill="#ff6b63" font-family="Tahoma, sans-serif" font-size="22" font-weight="bold">★</text>
    <text x="127.5" y="114" text-anchor="middle" fill="#ff7b74" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1">
      MONTHLY CREW PACK
    </text>
    <text x="127.5" y="144" text-anchor="middle" direction="rtl" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif" font-size="20" font-weight="bold">
      باندل اسکین ماهانه جدید
    </text>
    <text x="127.5" y="180" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      اسکین انحصاری ماه و استایل لگو
    </text>
    <text x="127.5" y="206" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      بک‌بلینگ، پیک‌اکس و استایل‌های
    </text>
    <text x="127.5" y="232" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      ویژه و ارتقایافته در هر ماه
    </text>
    <rect x="28" y="276" width="199" height="40" rx="12" fill="#e2453f" fill-opacity="0.16" />
    <text x="127.5" y="301" text-anchor="middle" direction="rtl" fill="#ff7b74" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13" font-weight="bold">
      تغییر خودکار اسکین در هر ماه
    </text>
  </g>

  <!-- Card 4 (Leftmost): Rocket Pass Premium -->
  <g transform="translate(40, 165)">
    <rect width="255" height="345" rx="20" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.38" stroke-width="1.5" />
    <circle cx="127.5" cy="58" r="32" fill="url(#accentPurple)" fill-opacity="0.2" stroke="#a855f7" stroke-width="2" />
    <text x="127.5" y="65" text-anchor="middle" fill="#c084fc" font-family="Tahoma, sans-serif" font-size="20" font-weight="bold">RL</text>
    <text x="127.5" y="114" text-anchor="middle" fill="#c084fc" font-family="Tahoma, sans-serif" font-size="11.5" font-weight="bold" letter-spacing="1">
      ROCKET PASS PREMIUM
    </text>
    <text x="127.5" y="144" text-anchor="middle" direction="rtl" fill="#ffffff" font-family="Tahoma, Vazirmatn, sans-serif" font-size="20" font-weight="bold">
      راکت‌پس پریمیوم رایگان
    </text>
    <text x="127.5" y="180" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      فعال‌سازی رایگان بتل‌پس بازی
    </text>
    <text x="127.5" y="206" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      راکت‌لیگ روی همان اکانت اپیک
    </text>
    <text x="127.5" y="232" text-anchor="middle" direction="rtl" fill="#cbd5e1" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13.5">
      به همراه ماشین و آیتم‌های مشترک
    </text>
    <rect x="28" y="276" width="199" height="40" rx="12" fill="#a855f7" fill-opacity="0.16" />
    <text x="127.5" y="301" text-anchor="middle" direction="rtl" fill="#c084fc" font-family="Tahoma, Vazirmatn, sans-serif" font-size="13" font-weight="bold">
      هدیه ویژه روی اکانت اپیک
    </text>
  </g>
</svg>
