<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan — Games, gear and tournaments</title>
<meta name="theme-color" content="#5c1f29">

<!-- Latin font. For Persian text add your own YekanBakh @font-face below (kept in the font stack). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  @font-face{
    font-family:'YekanBakh';
    src:url('/fonts/YekanBakh-Regular.woff2') format('woff2');
    font-weight:400; font-display:swap;
  }
*/

:root{
  --gutter:0px;
  --bg-page:#fbd8d8;
  --frame-a:#65232d;
  --frame-b:#4d1720;
  --panel:#3f1119;
  --panel-2:#44141d;
  --card:#4a1620;
  --red:#e2453f;
  --red-2:#f0645a;
  --cream:#fff0b3;
  --text:#fdf1f0;
  --muted:#c98d92;
  --muted-2:#a86068;
  --green:#3ddc84;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.3,1.6,.5,1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins','YekanBakh',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--text);
  min-height:100vh;
  padding:var(--gutter);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 480px at 58% -8%,rgba(255,120,110,.16),transparent 70%),
    radial-gradient(760px 520px at 0% 100%,rgba(122,80,230,.11),transparent 70%),
    linear-gradient(160deg,#65232d 0%,#571c26 55%,#4d1720 100%) fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:12px}

/* icons: <i data-icon="home"></i> sized by the parent's font-size */
i[data-icon]{display:inline-grid;place-items:center;width:1em;height:1em;font-style:normal;flex:none}
i[data-icon] svg{width:100%;height:100%}

/* ---------- Frame ---------- */
.frame{
  --px:0;--py:0;
  position:relative;z-index:1;isolation:isolate;
  max-width:1600px;margin:0 auto;
  min-height:100vh;
  display:grid;
  grid-template-columns:76px minmax(0,1fr) 76px;
  gap:clamp(14px,1.8vw,26px);
  padding:clamp(14px,1.8vw,28px);
  animation:frameIn 1s var(--ease-out) backwards;
}
@keyframes frameIn{from{opacity:0;translate:0 24px;scale:.975}}

.reveal{animation:rise .9s var(--ease-out) backwards;animation-delay:calc(var(--d,0)*90ms + 150ms)}
@keyframes rise{from{opacity:0;translate:0 26px;scale:.98}}

.panel{
  background:var(--panel);border-radius:34px;padding:18px 0;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);
}

/* ---------- Left nav ---------- */
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;transition:transform .5s var(--spring)}
.logo:hover{transform:rotate(-8deg) scale(1.1)}
.nav-list{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:38px}
.nav-ind{
  position:absolute;left:0;top:0;width:48px;height:48px;border-radius:16px;pointer-events:none;
  background:radial-gradient(circle,rgba(226,69,63,.34),rgba(226,69,63,0) 72%);
  box-shadow:0 0 34px rgba(226,69,63,.22);
  transition:transform .55s cubic-bezier(.3,1.35,.4,1);
}
.nav-item,.add-btn{position:relative}
.nav-item{
  z-index:1;width:48px;height:48px;display:grid;place-items:center;border-radius:16px;
  color:#e6a3a5;font-size:22px;transition:color .25s,transform .35s var(--spring);
}
.nav-item:hover{color:#fff;transform:translateX(2px) scale(1.08)}
.nav-item.active{color:var(--red)}
.nav-item::after,.add-btn::after{
  content:attr(data-label);position:absolute;left:calc(100% + 14px);top:50%;
  transform:translate(-6px,-50%);white-space:nowrap;pointer-events:none;
  background:#2a0a11;color:#fff;font-size:12px;padding:6px 11px;border-radius:10px;
  opacity:0;transition:opacity .2s,transform .25s var(--ease-out);z-index:30;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.nav-item:hover::after,.add-btn:hover::after,.nav-item:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.add-btn{
  margin-top:auto;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;
  border:1.5px dashed rgba(226,69,63,.55);transition:border-color .3s,background .3s;
}
.add-btn:hover{border-color:var(--red);background:rgba(226,69,63,.08)}
.add-btn .plus{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px;transition:transform .45s var(--spring)}
.add-btn:hover .plus{transform:rotate(90deg) scale(1.1)}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column;gap:22px;padding:6px 0}
.topbar{display:grid;grid-template-columns:1fr minmax(200px,290px) auto;align-items:center;gap:22px;position:relative;z-index:6}
.greet{font-weight:400;font-size:clamp(17px,1.6vw,22px);color:#cf8a90;white-space:nowrap}
.greet b{color:#fff;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-left:4px}

.search{
  position:relative;height:44px;border-radius:999px;background:#4c1822;color:#b97077;
  display:flex;align-items:center;gap:10px;padding:0 10px 0 16px;font-size:16px;
  transition:background .3s,box-shadow .3s,color .3s;
}
.search:focus-within{background:#571e29;color:#fff;box-shadow:0 0 0 2px rgba(226,69,63,.6),0 12px 30px rgba(0,0,0,.3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:13px}
.search input::placeholder{color:#b97077}
.search kbd{font:500 11px 'Poppins',sans-serif;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.08);color:#d9959b}
.results{
  position:absolute;left:0;right:0;top:calc(100% + 10px);padding:8px;border-radius:22px;background:#33101a;
  box-shadow:0 24px 50px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:translateY(-8px) scale(.98);
  transform-origin:top center;transition:opacity .25s,transform .35s var(--ease-out);z-index:30;
}
.search.open .results{opacity:1;pointer-events:auto;transform:none}
.results h5{font-size:11px;font-weight:500;color:var(--muted-2);padding:6px 10px 4px}
.results button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:14px;font-size:13px;transition:background .2s,transform .25s}
.results button:hover{background:rgba(255,255,255,.07);transform:translateX(3px)}
.results small{margin-left:auto;color:var(--muted-2);font-size:11px}
.results .empty{padding:14px 10px;font-size:13px;color:var(--muted)}

.top-actions{display:flex;gap:12px}
.round{
  position:relative;width:44px;height:44px;border-radius:50%;background:var(--panel);color:#fff;
  display:grid;place-items:center;font-size:19px;transition:transform .3s var(--spring),background .25s;
}
.round:hover{transform:translateY(-2px) scale(1.07);background:#4d1822}
.round:active{transform:scale(.93)}
.round .dot{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 0 3px #571c26}
.round .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:#ff4b4b;animation:ping 1.9s ease-out infinite}
.round .badge{
  position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--red);font-size:10px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 3px #571c26;
}
.badge.pop{animation:pop .45s var(--spring)}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.7);opacity:0}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}

.cols{display:grid;grid-template-columns:minmax(0,2.05fr) minmax(250px,1fr);gap:clamp(18px,2vw,28px);align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:-4px}
.sec-h h3{font-size:clamp(17px,1.5vw,20px);font-weight:500}
.sec-h a{font-size:12px;color:#b8737a;transition:color .2s}
.sec-h a:hover{color:#fff}
.sec-h a.arrow{font-size:20px;color:#fff;transition:transform .35s var(--spring)}
.sec-h a.arrow:hover{transform:translateX(5px)}

/* spotlight that follows the cursor */
.spot::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.13),transparent 65%);
}
.spot:hover::before{opacity:1}

/* ---------- Hero ---------- */
.hero{position:relative;z-index:2;height:clamp(224px,22vw,262px);border-radius:34px}
.hero-bg{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.hero-bg .l{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.hero-bg .l.on{opacity:1}
.l0{background:linear-gradient(100deg,#c73d3d 0%,#df5f57 55%,#ea8a70 100%)}
.l1{background:linear-gradient(100deg,#a82c56 0%,#d34a67 55%,#ee7e86 100%)}
.l2{background:linear-gradient(100deg,#a5322a 0%,#d15a2b 55%,#f0964a 100%)}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(420px 220px at 76% 40%,rgba(255,255,255,.18),transparent 70%),
             radial-gradient(320px 200px at 0% 100%,rgba(0,0,0,.2),transparent 70%);
}
.ring{position:absolute;right:9%;top:50%;border-radius:50%;border:1px dashed rgba(255,255,255,.26);animation:spin 46s linear infinite}
.ring.r1{width:300px;height:300px;margin-top:-150px}
.ring.r2{width:430px;height:430px;margin-top:-215px;right:2%;border-style:solid;border-color:rgba(255,255,255,.1);animation-direction:reverse;animation-duration:70s}
.sheen{position:absolute;top:-20%;bottom:-20%;left:-40%;width:26%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.17),transparent);transform:skewX(-18deg);animation:sheen 8s ease-in-out infinite 1.4s}
@keyframes sheen{0%{left:-40%}45%,100%{left:130%}}
@keyframes spin{to{transform:rotate(360deg)}}

.hero-body{position:relative;z-index:3;height:100%;width:min(56%,440px);padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.hero-body>*{transition:opacity .3s ease,transform .45s var(--ease-out)}
.hero-body>:nth-child(2){transition-delay:.04s}
.hero-body>:nth-child(3){transition-delay:.08s}
.hero-body>:nth-child(4){transition-delay:.12s}
.hero-body.swap>*{opacity:0;transform:translateY(12px)}
.hero-tags{display:flex;align-items:center;gap:8px}
#plats{display:flex;gap:8px}
.badge-pop{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px 0 10px;border-radius:999px;background:var(--cream);color:#2b1013;font-weight:500;font-size:12.5px}
.badge-pop i{font-size:15px;color:var(--red)}
.plat{width:32px;height:32px;border-radius:50%;background:#2a0d13;color:#fff;display:grid;place-items:center;font-size:17px;transition:transform .35s var(--spring)}
.plat:hover{transform:translateY(-3px) rotate(-8deg)}
.hero h2{font-size:clamp(28px,3vw,38px);font-weight:600;letter-spacing:-.5px;line-height:1.1}
.hero p{font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.9);max-width:320px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-foot{display:flex;align-items:center;gap:10px}
.faces{display:flex}
.face{display:block;overflow:hidden}
.face svg{width:100%;height:100%}
.faces .face{width:34px;height:34px;margin-left:-9px;border-radius:50%;border:2px solid #d95a53;background:#222;transition:transform .35s var(--spring)}
.faces .face:first-child{margin-left:0}
.faces:hover .face{transform:translateY(-3px)}
.faces .face:nth-child(2){transition-delay:.04s}
.faces .face:nth-child(3){transition-delay:.08s}
.pill-white{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#fff;color:#1d0a0d;font-weight:500;font-size:13px;transition:transform .3s var(--spring),box-shadow .3s}
.pill-white i{font-size:15px}
.pill-white:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.pill-white.liked i{color:var(--red);animation:pop .4s var(--spring)}

.hero-art{position:absolute;inset:0;z-index:2;pointer-events:none;clip-path:inset(-140px 0 0 0 round 0 0 34px 34px)}
.art{
  position:absolute;right:1%;bottom:0;height:124%;aspect-ratio:460/360;
  opacity:0;transform:translateX(46px) scale(.94);filter:blur(6px);
  transition:opacity .7s ease,transform .95s var(--ease-out),filter .7s ease;
}
.art.on{opacity:1;transform:none;filter:none}
.art svg{width:100%;height:100%;overflow:visible}
.art[data-hue="1"] svg{filter:hue-rotate(74deg) saturate(1.15)}
.art[data-hue="2"] svg{filter:hue-rotate(-38deg) saturate(1.2)}
.pl0{transform:translate(calc(var(--px)*-10px),calc(var(--py)*-6px))}
.pl1{transform:translate(calc(var(--px)*6px),calc(var(--py)*4px))}
.pl2{transform:translate(calc(var(--px)*16px),calc(var(--py)*10px))}
.fl{transform-box:fill-box;transform-origin:center;animation:floaty 5.5s ease-in-out infinite}
.fl.f2{animation-duration:7s;animation-delay:-2s}
.fl.f3{animation-duration:6.2s;animation-delay:-4s}
.orb{transform-box:fill-box;transform-origin:center;animation:orb 2.6s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes floaty{50%{transform:translateY(-9px)}}
@keyframes orb{50%{transform:scale(1.1);opacity:.88}}

.hero-live{
  position:absolute;right:20px;bottom:16px;z-index:4;display:flex;align-items:center;gap:10px;height:34px;padding:0 14px;
  border-radius:999px;font-size:11.5px;background:rgba(40,8,14,.4);border:1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.hero-live b{font-weight:600;font-variant-numeric:tabular-nums}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ff5c5c;animation:livepulse 1.6s infinite}
.hero-live .sep{width:1px;height:14px;background:rgba(255,255,255,.28)}
.hero-live span:last-child{font-variant-numeric:tabular-nums}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(255,92,92,.7)}70%,100%{box-shadow:0 0 0 8px rgba(255,92,92,0)}}

.dashes{position:absolute;top:10px;right:20px;z-index:5;display:flex;gap:6px}
.dash{position:relative;width:24px;height:18px;display:grid;align-items:center;transition:width .45s var(--spring)}
.dash.on{width:44px}
.dash span{display:block;position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
.dash i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}

/* ---------- Picks ---------- */
.picks{display:flex;flex-direction:column;gap:10px}
.pick{
  position:relative;display:flex;align-items:center;gap:12px;height:64px;padding:8px 16px 8px 8px;border-radius:24px;background:var(--panel);
  transition:transform .4s var(--spring),background .3s;
}
.pick:hover{transform:translateX(-5px);background:#521a25}
.thumb{width:48px;height:48px;border-radius:14px;overflow:hidden;flex:none;transition:transform .4s var(--spring)}
.thumb svg{width:100%;height:100%}
.pick:hover .thumb{transform:scale(1.08) rotate(-4deg)}
.pick-t{flex:1;min-width:0;font-size:12.5px;font-weight:500;line-height:1.3}
.pick-t em{font-style:normal;font-weight:400;color:#e38a90}
.pick>i{font-size:16px;color:#e9c6c6;transition:transform .35s var(--spring)}
.pick:hover>i{transform:translateX(4px)}

/* ---------- New games carousel ---------- */
.carousel{position:relative;margin:0 -22px}
.scroller{
  display:flex;gap:18px;overflow-x:auto;padding:18px 22px 20px;scroll-snap-type:x proximity;scrollbar-width:none;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 76%,transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 76%,transparent 100%);
}
.scroller::-webkit-scrollbar{display:none}
.scroller.drag{cursor:grabbing;scroll-snap-type:none;user-select:none}
.gcard{
  position:relative;flex:0 0 clamp(172px,15vw,198px);height:clamp(192px,17vw,216px);border-radius:32px;overflow:hidden;
  scroll-snap-align:start;isolation:isolate;background:#2a0a11;box-shadow:0 16px 30px -14px rgba(0,0,0,.65);
  transition:transform .55s var(--ease-out),box-shadow .4s;will-change:transform;
  animation:rise .9s var(--ease-out) backwards;animation-delay:calc(var(--d,0)*100ms + 350ms);
}
.gcard.feat{transform:rotate(-5deg);outline:1.5px dashed rgba(255,255,255,.38);outline-offset:-7px}
.gcard:hover{box-shadow:0 26px 40px -16px rgba(0,0,0,.75)}
.gart{position:absolute;inset:0;z-index:-1}
.gart svg{width:100%;height:100%}
.gcard::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72) 100%)}
.gbody{position:absolute;left:18px;right:16px;bottom:16px;z-index:2}
.gbody h4{font-size:clamp(15px,1.4vw,19px);font-weight:600;line-height:1.2}
.gdesc{max-height:0;opacity:0;overflow:hidden;transition:max-height .5s var(--ease-out),opacity .4s,margin .4s}
.gdesc p{font-size:9.6px;line-height:1.5;color:rgba(255,255,255,.88)}
.gprice{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;color:#ffd0c6}
.gcard:hover .gdesc,.gcard.feat .gdesc{max-height:84px;opacity:1;margin-top:8px}
.gplay,.gbuy{
  position:absolute;top:14px;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  opacity:0;transform:scale(.5);transition:transform .45s var(--spring),opacity .3s;
}
.gplay{left:14px;background:var(--red);color:#fff;font-size:16px;box-shadow:0 8px 20px rgba(226,69,63,.5)}
.gbuy{right:14px;background:#fff;color:var(--red);font-size:17px}
.gcard:hover .gplay,.gcard:hover .gbuy,.gcard.feat .gplay,.gcard.feat .gbuy{opacity:1;transform:scale(1)}
.gplay:hover,.gbuy:hover{transform:scale(1.15)!important}
.gplay:active,.gbuy:active{transform:scale(.9)!important}
.gcursor{position:absolute;z-index:4;right:24%;bottom:33%;font-size:22px;color:#fff;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));animation:nudge 2.4s ease-in-out infinite;pointer-events:none}
@keyframes nudge{50%{transform:translate(-5px,5px)}}
.next{
  position:absolute;right:42px;top:50%;z-index:5;width:40px;height:40px;border-radius:50%;background:#fff;color:#1d0a0d;font-size:18px;
  display:grid;place-items:center;transform:translateY(-50%);box-shadow:0 12px 26px rgba(0,0,0,.4);transition:transform .35s var(--spring);
}
.next:hover{transform:translateY(-50%) scale(1.13)}
.next:active{transform:translateY(-50%) scale(.92)}
.next i{transition:transform .3s}
.next:hover i{transform:translateX(2px)}

/* ---------- Last downloads ---------- */
.dl{
  position:relative;height:clamp(86px,8vw,96px);border-radius:32px;overflow:hidden;--p:.22;
  background:linear-gradient(90deg,#3a0f17,#4a1620 60%,#3a0f18);
}
.dl-lines{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.dl-fill{position:absolute;left:0;top:0;bottom:0;width:calc(190px + (100% - 190px)*var(--p));background:linear-gradient(90deg,#c23a3b,#dc4f48);transition:width 1s linear}
.dl-wave{position:absolute;left:calc(100% - 1px);top:0;width:26px;height:100%;overflow:hidden}
.dl-wave svg{position:absolute;left:0;top:0;width:26px;height:200%;animation:wave 5s linear infinite}
.dl.paused .dl-wave svg{animation-play-state:paused}
@keyframes wave{to{transform:translateY(-50%)}}
.dl-content{position:relative;z-index:2;height:100%;display:flex;align-items:center;gap:16px;padding:0 20px}
.dl-icon{width:60px;height:60px;flex:none;border-radius:18px;background:#f6efe6;color:#1b1b1b;display:grid;place-items:center;text-align:center;box-shadow:0 10px 20px -8px rgba(0,0,0,.5);transition:transform .45s var(--spring)}
.dl:hover .dl-icon{transform:rotate(-6deg) scale(1.06)}
.dl-icon em{display:block;font-style:italic;font-weight:800;font-size:13px;line-height:1;letter-spacing:-.4px}
.dl-icon em b{display:block;font-size:21px;font-weight:800}
.dl-info h4{font-size:17px;font-weight:600;margin-bottom:5px}
.tag{display:inline-block;font-size:10.5px;padding:3px 10px;border-radius:8px;background:rgba(58,12,20,.75);color:#f2c2c2}
.dl-meta{margin-left:auto;text-align:right;min-width:0}
.dl-meta strong{display:block;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl-meta small{font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dl-actions{display:flex;gap:8px}
.circle-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;transition:transform .3s var(--spring)}
.circle-btn:hover{transform:scale(1.14)}
.circle-btn:active{transform:scale(.9)}
.btn-red{background:var(--red);color:#fff}
.btn-white{background:#fff;color:var(--red)}

/* ---------- Statistic ---------- */
.stat{
  position:relative;border-radius:40px;padding:26px 20px 22px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;gap:24px;
  background:
    radial-gradient(260px 200px at 18% 80%,rgba(122,80,230,.36),transparent 70%),
    radial-gradient(240px 200px at 92% 8%,rgba(226,69,63,.22),transparent 70%),
    linear-gradient(170deg,#3d1119,#2b0a11);
}
.blob{--kick:0;position:relative;width:min(250px,78%);aspect-ratio:1;margin-top:4px;filter:drop-shadow(0 16px 34px rgba(226,69,63,.26));transition:transform .6s var(--spring)}
.stat:hover .blob{transform:scale(1.04)}
.blob canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.core{
  position:absolute;inset:20%;border-radius:50%;display:grid;place-content:center;text-align:center;gap:3px;
  background:radial-gradient(circle at 50% 30%,#4a1620,#2d0b12 78%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 0 40px rgba(0,0,0,.55);
  transform:scale(calc(1 + var(--kick)*.03));
}
.core::before{
  content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,.1);pointer-events:none;
  opacity:calc(.5 + var(--kick)*.5);transform:scale(calc(1 - var(--kick)*.025));
}
.core small{font-size:11px;color:#d98f98;max-width:90px;margin:0 auto;line-height:1.25}
.core strong{font-size:clamp(22px,2vw,28px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.gh-row{display:flex;justify-content:space-between;width:100%;padding:0 4px}
.gh{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;transition:transform .35s var(--spring)}
.gh .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;box-shadow:0 12px 24px -10px var(--c);transition:box-shadow .3s}
.gh .ic svg{width:24px;height:24px}
.gh:hover{transform:translateY(-6px)}
.gh:hover .ic{box-shadow:0 0 0 5px rgba(255,255,255,.08),0 16px 30px -8px var(--c)}
.gh.bump .gv{animation:bump .6s var(--ease-out)}
@keyframes bump{30%{color:#ffd9d2;transform:translateY(-4px)}}
.gv{display:block}

/* ---------- Right rail ---------- */
.rail{display:flex;flex-direction:column;gap:14px}
.rail .panel{padding:16px 0;gap:14px;border-radius:36px}
.rail .p1{flex:1}
.me{position:relative;width:46px;height:46px;padding:3px;border-radius:50%;background:#fff;transition:transform .4s var(--spring)}
.me:hover{transform:scale(1.1) rotate(-5deg)}
.me .face{width:100%;height:100%;border-radius:50%}
.rail-ic{font-size:20px;color:#e6a3a5;margin:2px 0}
.list{display:flex;flex-direction:column;align-items:center;gap:14px}
.av{position:relative;width:40px;height:40px;flex:none;border-radius:50%;margin-bottom:0;transition:transform .35s var(--spring),margin .35s var(--spring)}
.av .face{width:100%;height:100%;border-radius:50%}
.av:hover{transform:scale(1.14)}
.av.game{margin-bottom:8px}
.av.group .face{display:grid;place-items:center;background:#8d8d92;color:#fff;font-size:20px}
.av::before{
  content:attr(data-tip);position:absolute;right:calc(100% + 14px);top:50%;transform:translate(6px,-50%);white-space:nowrap;pointer-events:none;
  background:#2a0a11;color:#fff;font-size:12px;padding:6px 11px;border-radius:10px;opacity:0;
  transition:opacity .2s,transform .25s var(--ease-out);z-index:30;box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.av:hover::before{opacity:1;transform:translate(0,-50%)}
.st{position:absolute;top:-1px;right:-2px;width:12px;height:12px;border-radius:50%;background:#8f8f8f;box-shadow:0 0 0 3px var(--panel);transition:background .3s}
.st.online,.st.game{background:var(--green)}
.st.online::after,.st.game::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 2.6s ease-out infinite}
.nt{position:absolute;top:-1px;right:-2px;width:12px;height:12px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 0 3px var(--panel)}
.ingame{
  position:absolute;left:50%;bottom:-7px;background:var(--red);color:#fff;font-size:8px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;
  transform:translateX(-50%) scale(0);transition:transform .4s var(--spring);
}
.av.game .ingame{transform:translateX(-50%) scale(1)}

/* ---------- Toasts ---------- */
.toasts{position:fixed;right:clamp(14px,2vw,28px);bottom:clamp(14px,2vw,28px);z-index:100;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:12px;padding:11px 18px 11px 11px;border-radius:20px;font-size:12.5px;line-height:1.35;
  background:rgba(38,10,16,.94);border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 40px rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:toastIn .55s var(--spring) backwards;
}
.toast.out{animation:toastOut .4s ease forwards}
.toast b{display:block;font-weight:600}
.toast span.tx{color:#dfb3b7}
.t-ic{width:36px;height:36px;border-radius:12px;background:var(--red);display:grid;place-items:center;font-size:17px;flex:none}
@keyframes toastIn{from{opacity:0;translate:40px 0;scale:.9}}
@keyframes toastOut{to{opacity:0;translate:30px 0;scale:.95}}

/* ---------- Layout options (preview) ----------
   1 bleed   : full-bleed shell on the theme colour            (default)
   2 float   : rounded frame floating on a darker page
   3 ambient : full-bleed + a background that pulses with the beat */
html[data-layout="float"]{--gutter:clamp(12px,2.2vw,32px)}
html[data-layout="float"] body{
  background:
    radial-gradient(1000px 520px at 20% -10%,rgba(226,69,63,.20),transparent 65%),
    radial-gradient(800px 500px at 100% 100%,rgba(122,80,230,.15),transparent 60%),
    linear-gradient(180deg,#26080f,#170409) fixed;
}
html[data-layout="float"] .frame{
  max-width:1440px;min-height:calc(100vh - 2*var(--gutter));
  border-radius:clamp(28px,3.6vw,52px);
  background:linear-gradient(160deg,var(--frame-a) 0%,#571c26 55%,var(--frame-b) 100%);
  box-shadow:0 50px 100px -30px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05);
}
html[data-layout="float"] .frame::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(640px 300px at 55% 0%,rgba(255,120,110,.13),transparent 70%);
}
html[data-layout="ambient"] body{
  background:linear-gradient(160deg,#4d1720 0%,#3a0f17 55%,#2c0a11 100%) fixed;
}
html[data-layout="ambient"] .nav.panel,
html[data-layout="ambient"] .rail .panel{
  background:rgba(50,13,21,.62);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
html[data-layout="ambient"] .pick{background:rgba(72,19,30,.72)}
html[data-layout="ambient"] .pick:hover{background:rgba(92,26,39,.85)}
.ambient{display:none;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
html[data-layout="ambient"] .ambient{display:block}
.ag{position:absolute;border-radius:50%}
.ag1{width:52vw;height:52vw;left:20vw;top:-26vw;background:radial-gradient(circle,rgba(255,92,80,.95),rgba(255,92,80,0) 68%);opacity:calc(.28 + var(--b0,0)*.42);transform:scale(calc(1 + var(--b0,0)*.16));animation:drift1 16s ease-in-out infinite alternate}
.ag2{width:44vw;height:44vw;left:-12vw;bottom:-18vw;background:radial-gradient(circle,rgba(130,96,255,.95),rgba(130,96,255,0) 68%);opacity:calc(.2 + var(--b2,0)*.36);transform:scale(calc(1 + var(--b2,0)*.12));animation:drift2 20s ease-in-out infinite alternate}
.ag3{width:36vw;height:36vw;right:-8vw;bottom:-14vw;background:radial-gradient(circle,rgba(255,214,150,.9),rgba(255,214,150,0) 68%);opacity:calc(.1 + var(--b4,0)*.28);transform:scale(calc(1 + var(--b4,0)*.1));animation:drift3 24s ease-in-out infinite alternate}
@keyframes drift1{to{translate:6vw 4vw}}
@keyframes drift2{to{translate:8vw -5vw}}
@keyframes drift3{to{translate:-7vw -4vw}}

/* LAYOUT-PREVIEW START — delete this switcher (CSS, HTML #layoutSwitch, JS block) once you pick a layout */
.layout-switch{
  position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:90;display:flex;align-items:center;gap:4px;padding:5px;
  border-radius:999px;background:rgba(28,6,11,.88);border:1px solid rgba(255,255,255,.1);font-size:12px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.layout-switch span{padding:0 10px 0 12px;color:var(--muted-2)}
.layout-switch button{height:32px;padding:0 14px;border-radius:999px;color:#e8bcc0;white-space:nowrap;transition:background .25s,color .25s}
.layout-switch button:hover{color:#fff}
.layout-switch button[aria-pressed="true"]{background:var(--red);color:#fff}
/* LAYOUT-PREVIEW END */

/* ---------- Responsive ---------- */
@media (max-width:1300px){ .art{height:110%} }
@media (max-width:1180px){
  .cols{grid-template-columns:1fr}
  .col-b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
}
@media (max-width:860px){
  .frame{grid-template-columns:1fr;padding:14px 14px 96px}
  .nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:50;height:68px;padding:0 14px;flex-direction:row;justify-content:center;background:rgba(48,12,19,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .nav .logo,.add-btn{display:none}
  .nav-list{flex-direction:row;margin:0;gap:2px}
  .nav-item::after{display:none}
  .rail{display:none}
  .topbar{grid-template-columns:1fr auto}
  .search{grid-column:1/-1;order:3}
  .col-b{grid-template-columns:1fr}
  .hero{height:auto;min-height:270px}
  .hero-body{width:100%;padding-bottom:64px}
  .art{height:100%;right:-14%}
  .art.on{opacity:.4}
  .hero-live{left:20px;right:auto}
  html[data-layout="float"]{--gutter:8px}
  html[data-layout="float"] .frame{border-radius:28px}
  .layout-switch{bottom:92px;max-width:calc(100vw - 24px)}
  .layout-switch span{display:none}
  .layout-switch button{padding:0 8px;font-size:11px}
  .toasts{top:12px;bottom:auto;left:12px;right:12px}
}
@media (max-width:420px){ .greet{font-size:16px} .dl-info .tag{display:none} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>

<body>
<div class="ambient" id="ambient" aria-hidden="true"><i class="ag ag1"></i><i class="ag ag2"></i><i class="ag ag3"></i></div>
<div class="frame" id="frame">

  <!-- ===== Left navigation ===== -->
  <aside class="nav panel reveal" style="--d:0" aria-label="Main navigation">
    <a class="logo" href="#home" aria-label="Titan home">
      <svg viewBox="0 0 34 34" width="34" height="34" aria-hidden="true"><path d="M3 4h28v8H21v18h-8V12H3z" fill="#fff"/><path d="M3 4h11L3 15z" fill="#e2453f"/></svg>
    </a>
    <nav class="nav-list" id="navList">
      <span class="nav-ind" id="navInd"></span>
      <!-- Replace the hash links with your real routes -->
      <a class="nav-item active" href="#home" data-label="Home"><i data-icon="home"></i></a>
      <a class="nav-item" href="#games" data-label="Games"><i data-icon="game"></i></a>
      <a class="nav-item" href="#gift-cards" data-label="Gift cards"><i data-icon="gift"></i></a>

  <main class="main" id="home">

    <header class="topbar reveal" style="--d:1">

    <div class="cols">

      <!-- ---- Column A ---- -->
      <section class="col col-a">

        <article class="hero spot reveal" id="hero" style="--d:2">

            <i class="l l0 on"></i><i class="l l1"></i><i class="l l2"></i>

          <div class="hero-body" id="heroBody">

              <span class="badge-pop"><i data-icon="flame"></i>Popular</span>

            <div class="dl-icon"><em>FIFA<b>23</b></em></div>

            <div class="dl-meta"><strong id="dlEta">—</strong><small id="dlSize">—</small></div>

              <canvas id="blobCanvas" aria-hidden="true"></canvas>
              <div class="core"><small id="coreLabel">Total hours</small><strong id="coreVal">0h</strong></div>
            </div>
            <div class="gh-row" id="ghRow"></div>
          </article>

    </div>
  </main>

  <!-- ===== Right rail ===== -->
  <aside class="rail" aria-label="Friends">
    <div class="panel p1 reveal" style="--d:1">

<script>
(() => {

function cardArt(g, idx) {
  const t = THEME[g.theme], id = 'c' + idx;
  let topo = '';
  for (let i = 1; i <= 6; i++) topo += `<ellipse cx="${60 + (idx * 13) % 40}" cy="70" rx="${i * 24}" ry="${i * 16}" fill="none" stroke="${t.glow}" stroke-opacity="${(0.24 - i * 0.03).toFixed(2)}" transform="rotate(${-20 + idx * 9} 100 110)"/>`;
  let fig;
  if (g.fig === 'headset') {
    fig = `<path d="M52 128a48 48 0 0 1 96 0" fill="none" stroke="${t.fig}" stroke-width="9" stroke-linecap="round"/><rect x="40" y="120" width="22" height="42" rx="10" fill="${t.fig}"/><rect x="138" y="120" width="22" height="42" rx="10" fill="${t.fig}"/><path d="M50 158q0 20 30 22" stroke="${t.fig}" fill="none" stroke-width="5" stroke-linecap="round"/><circle cx="84" cy="181" r="5" fill="${t.glow}"/>`;
  } else if (g.fig === 'keyboard') {
    let k = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 9; c++) k += `<rect x="${26 + c * 16}" y="${112 + r * 17}" width="12" height="12" rx="3" fill="${t.glow}" opacity="${(0.25 + ((r * 9 + c) % 5) * 0.12).toFixed(2)}"/>`;
    fig = `<rect x="16" y="102" width="168" height="80" rx="14" fill="${t.fig}" transform="rotate(-8 100 142)"/><g transform="rotate(-8 100 142)">${k}</g>`;
  } else {
    fig = `${g.crest ? `<path d="M80 100l6-34 10 24 8-30 8 30 10-24 6 34z" fill="${t.glow}" opacity=".85"/>` : ''}<circle cx="100" cy="112" r="24" fill="${t.fig}"/><path d="M40 230c2-46 26-74 60-74s58 28 60 74z" fill="${t.fig}"/>`;
  }
  return `<svg viewBox="0 0 200 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.a}"/><stop offset="1" stop-color="${t.b}"/></linearGradient>
      <radialGradient id="${id}g"><stop offset="0" stop-color="${t.glow}" stop-opacity=".75"/><stop offset="1" stop-color="${t.glow}" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="200" height="220" fill="url(#${id}b)"/>
    ${topo}
    <circle cx="150" cy="52" r="46" fill="url(#${id}g)"/>
    ${fig}
  </svg>`;
}

/* 3D tilt */
if (matchMedia('(pointer:fine)').matches && !reduce) {
  $$('.gcard', sc).forEach(card => {

      if (sc.classList.contains('drag')) return;

      card.style.transition = 'transform .1s ease-out, box-shadow .4s';

/* drag to scroll + click handling */
let dragging = false, dragMoved = false, startX = 0, startL = 0;
sc.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.target.closest('button')) return;
  dragging = true; dragMoved = false; startX = e.clientX; startL = sc.scrollLeft;
});

/* =====================================================
   Downloads (simulated live progress)
   ===================================================== */
const dlEl = $('#dl'), dlEta = $('#dlEta'), dlSize = $('#dlSize'), dlToggle = $('#dlToggle');
const dl = { total: 1230, done: 265, speed: 3.4, state: 'run', wait: 0 };
function dlRender() {
  dlEl.style.setProperty('--p', Math.min(1, dl.done / dl.total).toFixed(4));
  dlEl.classList.toggle('paused', dl.state !== 'run');
  const secs = (dl.total - dl.done) / dl.speed;
  let eta;
  if (dl.state === 'pause') eta = 'Paused';
  else if (dl.state === 'cancel') eta = 'Cancelled';
  else if (dl.state === 'done') eta = 'Ready to play';
  else if (secs >= 3600) eta = `${Math.floor(secs / 3600)} hour ${Math.round(secs % 3600 / 60)} min.`;
  else if (secs >= 60) eta = `${Math.floor(secs / 60)} min ${Math.round(secs % 60)} s`;
  else eta = `${Math.max(1, Math.round(secs))} s`;
  dlEta.textContent = eta;
  dlSize.textContent = dl.state === 'done' ? '1.23 GB installed' : `${Math.round(dl.done)} MB of 1.23 GB`;
  dlToggle.innerHTML = ico(dl.state === 'run' ? 'pause' : 'play');
  dlToggle.setAttribute('aria-label', dl.state === 'run' ? 'Pause download' : dl.state === 'done' ? 'Launch game' : 'Resume download');
}
setInterval(() => {
  if (dl.state === 'run') {
    dl.speed = Math.max(1.8, Math.min(6.5, dl.speed + rand(-.5, .5)));
    dl.done = Math.min(dl.total, dl.done + dl.speed);
    if (dl.done >= dl.total) { dl.state = 'done'; dl.wait = 0; toast({ title: 'FIFA 23', text: 'Installed and ready to play', icon: 'game' }); }
  } else if (dl.state === 'done' && ++dl.wait > 8) {
    dl.done = 120; dl.state = 'run'; dl.wait = 0;   // demo loop
  }
  dlRender();
}, 1000);
dlToggle.addEventListener('click', () => {
  if (dl.state === 'run') dl.state = 'pause';
  else if (dl.state === 'done') { toast({ title: 'FIFA 23', text: 'Launching…', icon: 'game' }); return; }
  else { if (dl.state === 'cancel') dl.done = 0; dl.state = 'run'; }
  dlRender();
});
$('#dlCancel').addEventListener('click', () => {
  dl.state = 'cancel'; dl.done = 0; dlRender();
  toast({ title: 'Download cancelled', text: 'FIFA 23', icon: 'x' });
});
dlRender();

/* =====================================================
   Statistic
   ===================================================== */
const coreLabel = $('#coreLabel'), coreVal = $('#coreVal'), ghRow = $('#ghRow');
let total = HRS.reduce((a, h) => a + h.v, 0), coreShown = 0, coreRaf = 0, hovering = -1;
function setCore(label, val, dur = 700) {
  coreLabel.textContent = label;
  cancelAnimationFrame(coreRaf);
  if (reduce) { coreShown = val; coreVal.textContent = fmt(val) + 'h'; return; }
  const from = coreShown, t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    coreShown = from + (val - from) * e;
    coreVal.textContent = fmt(coreShown) + 'h';
    if (p < 1) coreRaf = requestAnimationFrame(step);
  };
  coreRaf = requestAnimationFrame(step);
}
function countTo(el, to, dur = 1600) {
  if (reduce) { el.textContent = fmt(to) + 'h'; return; }
  const t0 = performance.now();
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(to * e) + 'h';
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
/* ---- Total-hours blob: a flower that "plays music" ----
   A beat clock (kick / snare / hats) drives six "frequency bands"; every petal is
   one band, so the petals bounce like a circular equalizer. Hovering a game
   changes the tempo. Swap simulateBands() for a real AnalyserNode to react to actual audio. */
const BASE_BPM = 104;
let bpmTarget = BASE_BPM;
const blobEl = $('#blob'), cv = $('#blobCanvas'), cctx = cv.getContext('2d');
let cvSize = 0, dpr = 1;
const LAYERS = [
  { n: 5, rot: .3,  spd: .10,  off: 0, rs: 1.00, a: .96, g: [0, -1, 0, .95],     st: [[0, '#f5524a'], [.5, '#c2343b'], [1, 'rgba(90,24,40,0)']],      rim: 'rgba(255,150,140,.30)' },
  { n: 6, rot: 1.4, spd: -.06, off: 3, rs: .96,  a: .45, g: [.7, -.5, -.5, .9],  st: [[0, '#ff9a90'], [1, 'rgba(255,120,120,0)']],                     rim: 'rgba(255,190,180,.18)' },
  { n: 5, rot: 1.1, spd: -.07, off: 2, rs: .95,  a: .94, g: [-1, -.2, .75, .3],  st: [[0, '#fff6d2'], [.45, '#ebcf9c'], [1, 'rgba(190,130,110,0)']],   rim: 'rgba(255,255,255,.42)' },
  { n: 6, rot: .4,  spd: .055, off: 4, rs: .92,  a: .93, g: [-.7, 1, .45, -.25], st: [[0, '#bdb1ff'], [.5, '#6f5ad9'], [1, 'rgba(80,60,190,0)']],      rim: 'rgba(215,205,255,.40)' }
];
const bands = [.2, .2, .2, .2, .2, .2];
let beat = 0, bpm = BASE_BPM, kickSm = 0;

function sizeCanvas() {
  dpr = Math.min(2, devicePixelRatio || 1);
  cvSize = blobEl.offsetWidth;
  cv.width = cv.height = Math.round(cvSize * dpr);
}
function simulateBands(t, dt) {
  bpm += (bpmTarget - bpm) * (1 - Math.exp(-dt * 2.5));
  beat += dt * bpm / 60;
  const b = beat % 4;
  const hit = (times, decay) => { let m = 4; for (const x of times) m = Math.min(m, (b - x + 4) % 4); return Math.exp(-m * decay); };
  const kick = hit([0, 2, 2.75], 5.5);
  const snare = hit([1, 3], 5);
  const hat = Math.exp(-((b * 2) % 1) * 7) * (Math.floor(b * 2) % 2 ? 1 : .55);
  const wob = k => .5 + .5 * Math.sin(t * (1.1 + k * .37) + k * 1.9);
  const target = [
    kick * .95 + .10 * wob(0),
    kick * .60 + snare * .30 + .15 * wob(1),
    snare * .85 + .15 * wob(2),
    snare * .40 + hat * .50 + .20 * wob(3),
    hat * .80 + .20 * wob(4),
    hat * .50 + kick * .15 + .30 * wob(5)
  ];
  for (let k = 0; k < 6; k++) {
    const rate = 1 - Math.exp(-dt * (target[k] > bands[k] ? 28 : 7));   // fast attack, slow release
    bands[k] += (target[k] - bands[k]) * rate;
  }
  kickSm += (kick - kickSm) * (1 - Math.exp(-dt * (kick > kickSm ? 30 : 8)));
}
function drawBlob(dt) {
  const s = cvSize, R = s * .5, ctx = cctx;
  const scale = 1 + .055 * kickSm;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, s, s);
  ctx.translate(R, R);
  for (const L of LAYERS) {
    L.rot += dt * L.spd * (1 + 3 * kickSm);
    const R0 = s * .41 * L.rs * scale, sigma = .36 * (Math.PI * 2 / L.n), N = 150;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const th = i / N * Math.PI * 2;
      let r = .84;
      for (let j = 0; j < L.n; j++) {
        let d = th - (L.rot + j * 2 * Math.PI / L.n);
        d = Math.atan2(Math.sin(d), Math.cos(d));
        r += (.20 + .17 * bands[(j + L.off) % 6]) * Math.exp(-(d * d) / (sigma * sigma));
      }
      const x = Math.cos(th) * r * R0, y = Math.sin(th) * r * R0;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(L.g[0] * R, L.g[1] * R, L.g[2] * R, L.g[3] * R);
    L.st.forEach(([o, c]) => g.addColorStop(o, c));
    ctx.globalAlpha = L.a; ctx.fillStyle = g; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = 1.2; ctx.strokeStyle = L.rim; ctx.stroke();
  }
  blobEl.style.setProperty('--kick', kickSm.toFixed(3));
}
let blobVisible = true, blobLast = performance.now(), layout = 'bleed';
const ambientEl = $('#ambient');
function updateAmbient() {           // feeds the beat into the background glows (layout 3 only)
  ambientEl.style.setProperty('--b0', kickSm.toFixed(2));
  ambientEl.style.setProperty('--b2', bands[2].toFixed(2));
  ambientEl.style.setProperty('--b4', bands[4].toFixed(2));
}
function blobLoop(now) {
  const dt = Math.min((now - blobLast) / 1000, .1); blobLast = now;
  if (!document.hidden) {
    const amb = layout === 'ambient';
    if (blobVisible || amb) simulateBands(now / 1000, dt);
    if (blobVisible) drawBlob(dt);
    if (amb) updateAmbient();
  }
  requestAnimationFrame(blobLoop);
}
new ResizeObserver(() => { sizeCanvas(); if (reduce) { simulateBands(1.3, .016); drawBlob(0); } }).observe(blobEl);
new IntersectionObserver(([en]) => blobVisible = en.isIntersecting).observe(blobEl);
sizeCanvas();
if (reduce) { simulateBands(1.3, .016); drawBlob(0); } else requestAnimationFrame(blobLoop);

/* LAYOUT-PREVIEW START — delete with the switcher HTML/CSS once you pick a layout */
const LAYOUTS = [['bleed', '1 · Full-bleed'], ['float', '2 · Floating frame'], ['ambient', '3 · Live ambient']];
const swEl = $('#layoutSwitch');
swEl.innerHTML = '<span>Layout</span>' + LAYOUTS.map(([k, n]) => `<button data-k="${k}" aria-pressed="false">${n}</button>`).join('');
function setLayout(k) {
  layout = k;
  document.documentElement.dataset.layout = k;
  $$('button', swEl).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  try { localStorage.setItem('titan-layout', k); } catch (e) {}
}
swEl.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) setLayout(b.dataset.k); });
(() => {
  let saved = null; try { saved = localStorage.getItem('titan-layout'); } catch (e) {}
  const fromHash = (location.hash.match(/layout=(\w+)/) || [])[1];   // e.g. index.html#layout=float
  setLayout([fromHash, saved].find(k => LAYOUTS.some(l => l[0] === k)) || 'bleed');
})();
/* LAYOUT-PREVIEW END */

ghRow.innerHTML = HRS.map((h, i) => `
  <button class="gh" data-i="${i}" style="--c:${h.c}" aria-label="${esc(h.name)}">
    <span class="ic" style="background:${h.c};color:${h.fg}">${GLYPH[h.k]}</span>
    <span class="gv" id="gv${i}">0h</span>
  </button>`).join('');
$$('.gh', ghRow).forEach(b => {
  const i = +b.dataset.i;
  const on = () => { hovering = i; bpmTarget = HRS[i].bpm; setCore(HRS[i].name, HRS[i].v, 550); };
  const off = () => { hovering = -1; bpmTarget = BASE_BPM; setCore('Total hours', total, 550); };
  b.addEventListener('pointerenter', on); b.addEventListener('pointerleave', off);
  b.addEventListener('focus', on);        b.addEventListener('blur', off);
});
setTimeout(() => {
  setCore('Total hours', total, 1900);
  HRS.forEach((h, i) => countTo($('#gv' + i), h.v, 1900));
}, 650);
setInterval(() => {              // one more hour played, every few seconds
  const i = Math.floor(Math.random() * HRS.length);
  HRS[i].v++; total++;
  $('#gv' + i).textContent = fmt(HRS[i].v) + 'h';
  const b = $(`.gh[data-i="${i}"]`); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  if (hovering === -1) setCore('Total hours', total, 500);
  else if (hovering === i) setCore(HRS[i].name, HRS[i].v, 500);
}, 9000);

/* =====================================================
   Right rail (friends + presence)
   ===================================================== */
const tip = f => `${f.n} · ${f.s === 'game' ? 'In game — ' + f.g : f.s === 'online' ? 'Online' : 'Away'}`;
$('#me').innerHTML = `<span class="face">${avatar(5)}</span>`;
$('#friends').innerHTML = FRIENDS.map((f, i) => `
  <button class="av ${f.s}" data-f="${i}" data-tip="${esc(tip(f))}" aria-label="${esc(tip(f))}">
    <span class="face">${avatar(f.seed)}</span><i class="st ${f.s}"></i><span class="ingame">In Game</span>
  </button>`).join('');
$('#chats').innerHTML = CHATS.map((c, i) => `
  <button class="av${c.group ? ' group' : ''}" data-c="${i}" data-tip="${esc(c.n)}" aria-label="${esc(c.n)}">
    <span class="face">${c.group ? '<i data-icon="users"></i>' : avatar(c.seed)}</span>${c.unread ? '<i class="nt"></i>' : ''}
  </button>`).join('');
$('#friends').addEventListener('click', e => {
  const b = e.target.closest('.av'); if (!b) return;
  toast({ title: 'Invite sent', text: `${FRIENDS[b.dataset.f].n} will see it in their lobby`, icon: 'users' });
});
$('#chats').addEventListener('click', e => {
  const b = e.target.closest('.av'); if (!b) return;
  const nt = $('.nt', b); if (nt) nt.remove();
  toast({ title: CHATS[b.dataset.c].n, text: 'Opening chat…', icon: 'chat' });
});
function setStatus(i, s) {
  const f = FRIENDS[i], b = $(`.av[data-f="${i}"]`);
  f.s = s; if (s === 'game') f.g = pickOne(GAMES_LIVE);
  b.className = 'av ' + s;
  $('.st', b).className = 'st ' + s;
  b.dataset.tip = tip(f); b.setAttribute('aria-label', tip(f));
  return f;
}
(function presenceLoop() {
  setTimeout(() => {
    const i = Math.floor(Math.random() * FRIENDS.length);
    const next = pickOne(['online', 'away', 'game'].filter(s => s !== FRIENDS[i].s));
    const f = setStatus(i, next);
    if (next === 'game' && Math.random() < .7) liveToast({ title: f.n, text: `started playing ${f.g}`, icon: 'game' });
    else if (next === 'online' && Math.random() < .5) liveToast({ title: f.n, text: 'is online', icon: 'users' });
    presenceLoop();
  }, rand(7000, 11000));
})();
(function announcements() {
  const list = [
    { title: 'Valorant Titan Cup', text: 'Registration closes in 10 minutes', icon: 'trophy' },
    { title: 'Flash sale', text: 'Titan Pro Headset — 20% off for the next hour', icon: 'bag' },
    { title: 'Rocket Series', text: 'Round 2 bracket is live', icon: 'trophy' }
  ];
  let n = 0;
  setTimeout(function again() {
    liveToast(list[n++ % list.length]);
    setTimeout(again, rand(24000, 36000));
  }, 6500);
})();

/* =====================================================
   Cursor spotlight, parallax and the main animation loop
   ===================================================== */
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('.spot');
  if (!t) return;
  const r = t.getBoundingClientRect();
  t.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  t.style.setProperty('--my', (e.clientY - r.top) + 'px');
}, { passive: true });

let tx = 0, ty = 0, cx = 0, cy = 0, pointerActive = false;
if (matchMedia('(pointer:fine)').matches) {
  addEventListener('pointermove', e => { pointerActive = true; tx = (e.clientX / innerWidth - .5) * 2; ty = (e.clientY / innerHeight - .5) * 2; }, { passive: true });
  document.addEventListener('pointerleave', () => pointerActive = false);
}
let last = performance.now();
function loop(t) {
  const dt = Math.min(t - last, 100); last = t;
  if (!reduce) {
    const gx = pointerActive ? tx : Math.sin(t / 3200) * .55;   // gentle idle drift when the pointer is away
    const gy = pointerActive ? ty : Math.cos(t / 4100) * .4;
    cx += (gx - cx) * .07; cy += (gy - cy) * .07;
    frame.style.setProperty('--px', cx.toFixed(3));
    frame.style.setProperty('--py', cy.toFixed(3));
    if (!paused && !document.hidden) {
      elapsed += dt;
      if (elapsed >= CONFIG.slideMs) goTo((cur + 1) % SLIDES.length);
    }
    dashFills[cur].style.transform = `scaleX(${Math.min(1, elapsed / CONFIG.slideMs).toFixed(4)})`;
  }
  requestAnimationFrame(loop);
}

/* =====================================================
   Boot
   ===================================================== */
paint();
goTo(0, true);
moveInd($('.nav-item.active'), true);
addEventListener('load', () => moveInd($('.nav-item.active'), true));
requestAnimationFrame(loop);
